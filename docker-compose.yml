# Services
services:

  # Frontend
  frontend_app:
    build: ./gym-app-frontend/.
    container_name: frontend
    restart: always
    ports:
      - "5173:8080"
    networks:
      - my-network

  # Backend
  backend_app:
    build: ./gym-app-backend/.
    container_name: backend_app
    restart: always
    ports:
      - "8080:8080"
    environment:
        env_file: .env
    depends_on:
      - postgresql_db
    networks:
      - my-network

  # Mosquitto
  mqtt:
    build: ./mqtt
    image: gym-app-mosquitto:2.0.18
    container_name: mqtt
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    networks:
      - my-network

  # PostgreSQL
  postgresql_db:
    build: ./db
    image: gym-app-postgres:15.2
    container_name: postgresql_db
    restart: always
    environment:
       env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - my-network

  # Adminer
  adminer_panel:
    image: adminer:4.8.1
    container_name: adminer_panel
    restart: always
    ports:
      - 9090:8080
    environment:
       env_file: .env
    depends_on:
      - postgresql_db
    networks:
      - my-network


# Volumes
volumes:
  postgres_data:
  mqtt:

# Networks
networks:
  my-network:
    driver: bridge
