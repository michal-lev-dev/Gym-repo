server:
  port: 8080

spring:
  banner:
    location: Banner.txt
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        show_sql: true
        type:
          wrapper_array_handling: ALLOW
    database: postgresql

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# MQTT
mqtt:
  broker-url: ${BROKER_URL}

jwt:
  key: ${JWT_KEY}

  expirationAccessToken: 604800000
  expirationRefreshToken: 604800000

# Project Description
application:
  title: 'gym app'
  version: 'v1.0'
